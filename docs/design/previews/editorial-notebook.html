<style>
#ge-preview{--paper:light-dark(#f6f4ee,#141716);--ink:light-dark(#202b28,#e5e9e2);--quiet:light-dark(#596660,#a5b3ab);--line:light-dark(#d3d9cf,#35433c);--panel:light-dark(#ecefe6,#202922);--accent:light-dark(#31583e,#b7d990);background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,sans-serif;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#ge-preview *{box-sizing:border-box}#ge-preview button,#ge-preview input{font:inherit}#ge-preview button{cursor:pointer;color:inherit}#ge-preview button:focus-visible,#ge-preview input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#ge-preview .top{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}#ge-preview .brand{border:0;background:none;padding:0;text-align:left;font-weight:650;letter-spacing:-.5px;font-size:18px}#ge-preview .brand small{display:block;font:10px/1.8 monospace;letter-spacing:2px;color:var(--quiet)}#ge-preview nav{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;padding-right:50px}#ge-preview nav button{border:0;background:none;padding:7px 9px;font-size:12px;border-radius:4px}#ge-preview nav button[aria-current=page]{background:var(--ink);color:var(--paper)}#ge-preview .notice{padding:6px 28px;font:10px/1.6 monospace;letter-spacing:1px;color:var(--quiet);border-bottom:1px solid var(--line)}#ge-preview main{padding:34px 32px 38px;min-height:680px}#ge-preview .eyebrow{font:11px/1.6 monospace;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent)}#ge-preview h1{font:500 clamp(32px,5vw,55px)/1.08 Georgia,serif;letter-spacing:-1.8px;margin:16px 0 20px;max-width:670px}#ge-preview h2{font:500 25px/1.25 Georgia,serif;margin:0}#ge-preview h3{font:500 20px/1.3 Georgia,serif;margin:6px 0}#ge-preview p{margin:0;color:var(--quiet)}#ge-preview .lede{max-width:550px;font-size:15px}#ge-preview .hero{display:grid;grid-template-columns:1.65fr 1fr;gap:35px;padding-bottom:34px;border-bottom:1px solid var(--line)}#ge-preview .art{display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:50% 50% 4px 4px;min-height:240px;position:relative;overflow:hidden}#ge-preview .orbit{width:175px;height:175px;border:1px solid var(--accent);border-radius:50%;position:relative;transform:rotate(-28deg)}#ge-preview .orbit:before,#ge-preview .orbit:after{content:'';position:absolute;inset:18px -22px;border:1px solid var(--accent);border-radius:50%;transform:rotate(65deg)}#ge-preview .orbit:after{inset:-20px 45px;transform:rotate(20deg)}#ge-preview .nucleus{position:absolute;width:16px;height:16px;background:var(--accent);border-radius:50%}#ge-preview .art span{position:absolute;bottom:16px;font:10px monospace;letter-spacing:2px;color:var(--quiet)}#ge-preview .action{display:inline-flex;border:1px solid var(--line);background:none;padding:9px 15px;border-radius:5px;margin-top:22px;gap:15px}#ge-preview .action.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}#ge-preview .section-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;margin:28px 0 16px}#ge-preview .subtle{font:11px monospace;color:var(--quiet)}#ge-preview .subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}#ge-preview .subject{border:0;background:var(--paper);padding:16px;text-align:left;display:flex;gap:12px;align-items:center;justify-content:space-between}#ge-preview .subject:hover{background:var(--panel)}#ge-preview .subject small{font:11px monospace;color:var(--quiet)}#ge-preview .stories{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}#ge-preview .story{padding:18px 0;text-align:left;border:0;border-top:1px solid var(--line);background:none}#ge-preview .story p{font-size:12px}#ge-preview .tag{font:10px monospace;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}#ge-preview .filters{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0}#ge-preview .filters button{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px}#ge-preview .filters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}#ge-preview .search{width:100%;padding:12px 14px;margin-top:24px;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:5px}#ge-preview .list-item{display:grid;grid-template-columns:130px 1fr 24px;gap:18px;align-items:center;width:100%;padding:21px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}#ge-preview .list-item p{font-size:12px}#ge-preview .statement{padding:26px;background:var(--panel);margin:25px 0;border-left:2px solid var(--accent)}#ge-preview .reader{max-width:650px;margin:auto}#ge-preview .reader p{font-size:16px;margin:18px 0}#ge-preview .reader h2{margin-top:30px}#ge-preview .reader .formula{padding:26px;text-align:center;background:var(--panel);font:24px Georgia,serif}#ge-preview footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:18px 28px;border-top:1px solid var(--line);font:11px monospace;color:var(--quiet)}#ge-preview .back{background:none;border:0;padding:0;color:var(--quiet);font-size:12px}#ge-preview .empty{padding:30px 0}
@media(max-width:650px){#ge-preview .top{padding:18px}#ge-preview nav{margin:0;padding:0}#ge-preview main{padding:24px 18px;min-height:650px}#ge-preview .hero{grid-template-columns:1fr}#ge-preview .art{display:none}#ge-preview .subjects{grid-template-columns:repeat(2,1fr)}#ge-preview .stories{grid-template-columns:1fr;gap:0}#ge-preview .list-item{grid-template-columns:1fr;gap:4px}#ge-preview .list-item>span:last-child{display:none}#ge-preview .section-head{flex-wrap:wrap}#ge-preview button{min-height:40px}}
</style>
<div id="ge-preview" aria-label="General Engineering editorial design">
<header class="top"><button class="brand" data-page="Home">General Engineering<small>TRAN VAN TINH / AN OPEN NOTEBOOK</small></button><nav aria-label="Main navigation"></nav></header>
<div class="notice">DESIGN PREVIEW · SAMPLE ARTICLES</div>
<main id="ge-main" aria-live="polite"></main>
<footer><span>Independent thinking. Shared knowledge.</span><span>General Engineering · By Tran Van Tinh</span></footer>
</div>
<script>
(()=>{
const root=document.getElementById('ge-preview'),main=root.querySelector('main'),nav=root.querySelector('nav');
const pages=['Home','Library','Ideas','Experiments','Open Source','About'];
const subjects=['Mathematics','Physics','Biology','Computer Science','Engineering','Intelligence'];
const entries=[
{title:'What survives when a system changes?',subject:'Mathematics',kind:'Essay',desc:'Invariants as a language for understanding change.'},
{title:'Feedback: from living cells to machines',subject:'Biology',kind:'Connection',desc:'A shared pattern across organisms and engineered systems.'},
{title:'Where integer boundaries break assumptions',subject:'Computer Science',kind:'Source study',desc:'A proposed walkthrough of representation, parsing, and edge cases.'},
{title:'Energy, information, and the cost of computation',subject:'Physics',kind:'Reading note',desc:'Questions at the boundary of physical and computational limits.'},
{title:'Designing systems that learn from failure',subject:'Engineering',kind:'Essay',desc:'Observability, adaptation, and useful constraints.'},
{title:'What would count as recursive improvement?',subject:'Intelligence',kind:'Open question',desc:'Separating an ambitious hypothesis from a measurable claim.'}];
let page='Home',filter='All',query='';
const state={serif:true};
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page,subject:filter},privateContent:{query}}).catch(()=>{});}
function cards(items){return items.map(e=>`<button class="story" data-article="${entries.indexOf(e)}"><span class="tag">${e.subject} / ${e.kind}</span><h3>${e.title}</h3><p>${e.desc}</p></button>`).join('');}
function rows(items){return items.length?items.map(e=>`<button class="list-item" data-article="${entries.indexOf(e)}"><span class="tag">${e.subject}<br>${e.kind}</span><div><h3>${e.title}</h3><p>${e.desc}</p></div><span>↗</span></button>`).join(''):'<p class="empty">No sample articles match this search.</p>';}
function updateRows(){const el=root.querySelector('#ge-results');if(el)el.innerHTML=rows(entries.filter(e=>(filter==='All'||e.subject===filter)&&`${e.title} ${e.subject} ${e.desc}`.toLowerCase().includes(query.toLowerCase())));}
function render(){
nav.innerHTML=pages.map(n=>`<button data-page="${n}" ${page===n?'aria-current="page"':''}>${n}</button>`).join('');
if(page==='Home')main.innerHTML=`<section class="hero"><div><span class="eyebrow">Across disciplines. Beyond the obvious.</span><h1>Ideas worth<br>building on.</h1><p class="lede">Exploring the principles that connect nature, computation, and the things we build.</p><button class="action primary" data-page="Library">Explore the notebook <span>↗</span></button></div><div class="art" aria-hidden="true"><div class="orbit"></div><div class="nucleus"></div><span>DIFFERENT FIELDS. SHARED QUESTIONS.</span></div></section><div class="section-head"><h2>Explore the disciplines</h2><span class="subtle">Follow a question across boundaries</span></div><div class="subjects">${subjects.map((s,i)=>`<button class="subject" data-subject="${s}"><span><small>0${i+1} / </small>${s}</span><span>↗</span></button>`).join('')}</div><div class="section-head"><h2>From the notebook</h2><span class="subtle">Illustrative article selections</span></div><div class="stories">${cards(entries.slice(0,3))}</div>`;
if(page==='Library'){
main.innerHTML=`<span class="eyebrow">The knowledge library</span><h1>Follow your curiosity.</h1><p class="lede">Essays, explanations, and connections across disciplines.</p><input class="search" type="search" aria-label="Search sample articles" placeholder="Search ideas, subjects, questions…"><div class="filters">${['All',...subjects].map(s=>`<button data-filter="${s}" aria-pressed="${filter===s}">${s}</button>`).join('')}</div><div id="ge-results"></div>`;root.querySelector('input').value=query;updateRows();}
if(page==='Ideas')main.innerHTML=`<span class="eyebrow">Ideas & abstractions</span><h1>Start with a better question.</h1><p class="lede">Original perspectives, cross-disciplinary connections, and hypotheses open to scrutiny.</p><div class="statement"><span class="tag">Long-term ambition</span><h3>Knowledge the world can build on.</h3><p>Contribute foundations for research toward superintelligence and recursive self-improvement.</p></div>${rows([entries[5],entries[1],entries[0]])}`;
if(page==='Experiments')main.innerHTML=`<span class="eyebrow">The laboratory</span><h1>Make an idea testable.</h1><p class="lede">Models, simulations, and practical experiments. Each starts with a question and ends with evidence.</p><div class="section-head"><h2>Proposed experiments</h2><span class="subtle">Concepts for future articles</span></div><div class="stories">${cards([entries[1],entries[3],entries[4]])}</div><div class="statement"><span class="tag">Experiment format</span><h3>Question → model → observation → limits</h3><p>Code, parameters, and reproduction steps live alongside the explanation.</p></div>`;
if(page==='Open Source')main.innerHTML=`<span class="eyebrow">Engineering in the open</span><h1>Read the code.<br>Understand the system.</h1><p class="lede">Source walkthroughs, bug investigations, and contribution notes grounded in real implementations.</p><div class="section-head"><h2>Proposed investigations</h2><span class="subtle">Sample content</span></div>${rows([entries[2]])}<div class="statement"><span class="tag">Anatomy of an investigation</span><h3>Reproduce. Trace. Explain. Verify.</h3><p>Record the source revision, smallest example, test results, and upstream status.</p></div>`;
if(page==='About')main.innerHTML=`<span class="eyebrow">About the notebook</span><h1>A place for<br>independent thinking.</h1><p class="lede">By Tran Van Tinh. Exploring ideas and abstractions across science and engineering, and sharing them for others to question, test, and develop.</p><div class="statement"><h3>A resource the world can build on.</h3><p>The ambition is to contribute valuable foundations toward SI and RSI. Trust grows through clear reasoning, evidence, and correction.</p></div><div class="stories"><div class="story"><span class="tag">01 / Breadth</span><h3>Follow the question.</h3><p>Disciplines are starting points, not boundaries.</p></div><div class="story"><span class="tag">02 / Rigor</span><h3>Show the evidence.</h3><p>Distinguish established results from new hypotheses.</p></div><div class="story"><span class="tag">03 / Openness</span><h3>Invite correction.</h3><p>Link sources and make reasoning inspectable.</p></div></div>`;
applyType();}
function article(index){const e=entries[index];page='Article';nav.querySelectorAll('button').forEach(b=>b.removeAttribute('aria-current'));main.innerHTML=`<article class="reader"><button class="back" data-page="Library">← Back to library</button><div style="margin-top:30px"><span class="eyebrow">${e.subject} / ${e.kind} / sample draft</span><h1>${e.title}</h1><p>${e.desc}</p><span class="subtle">Tran Van Tinh · Illustrative reader layout</span></div><div class="statement"><span class="tag">The central question</span><h3>What stays useful when we cross the boundary between disciplines?</h3></div><h2>Begin with a concrete model</h2><p>An abstraction is useful when it preserves the relationships that matter. Start with a small example, state its assumptions, and ask which conclusions survive a change in context.</p><div class="formula">Question → Model → Evidence</div><h2>Connections and limits</h2><p>A shared pattern can suggest a new line of investigation. It still needs evidence: similar language does not establish an identical mechanism.</p><details><summary>Sources & reproduction notes</summary><p>Published articles will link primary sources, relevant code revisions, and experiment details here. This preview contains sample prose.</p></details><button class="action" data-page="Ideas">Explore related ideas ↗</button></article>`;applyType();}
function applyType(){root.querySelectorAll('h1,h2,h3').forEach(e=>e.style.fontFamily=state.serif?'Georgia, serif':'system-ui, sans-serif');}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();}if(b.dataset.subject){page='Library';filter=b.dataset.subject;render();}if(b.dataset.filter){filter=b.dataset.filter;render();}if(b.dataset.article!==undefined)article(Number(b.dataset.article));save();});
root.addEventListener('input',ev=>{if(ev.target.matches('.search')){query=ev.target.value;updateRows();save();}});
function restore(s){const m=s?.modelContent;if(m){page=pages.includes(m.page)?m.page:'Home';filter=['All',...subjects].includes(m.subject)?m.subject:'All';query=s.privateContent?.query||'';}render();}
restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',ev=>{if(ev.detail?.globals?.widgetState)restore(ev.detail.globals.widgetState);});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:applyType});t.addToggle(state,'serif',{label:'Editorial serif headings'});}
})();
</script>
