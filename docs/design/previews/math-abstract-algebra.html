<article><p class="eyebrow">Mathematics / Abstract Algebra / Learning session</p><h1>Sets, operations,<br>and closure.</h1><span class="badge">Part 1 · Draft for your review</span><p class="intro">Start by choosing the objects we work with, then decide how to combine them.</p>
<section class="section session-section" id="sets"><h2>1. Sets: which objects?</h2><p>The integers form a set:</p><p class="equation">ℤ = {…, −2, −1, 0, 1, 2, …}</p><p>We write <strong>3 ∈ ℤ</strong> to say that 3 belongs to the integers. But <strong>½ ∉ ℤ</strong>: one half is not an integer.</p><p>The even integers form a subset:</p><p class="equation">E = {2k | k ∈ ℤ}, &nbsp; E ⊆ ℤ</p><p>Every element of E is an integer.</p></section>
<section class="section session-section" id="operations"><h2>2. Operations: how do we combine them?</h2><p>A binary operation on a set S takes any ordered pair of elements of S and returns exactly one element of S:</p><p class="equation">∗ : S × S → S</p><p>Addition sends the pair (3, 5) to 8. Operations need not be arithmetic: concatenation combines “ab” and “cd” into “abcd”. The symbol ∗ is just a name for an operation.</p></section>
<section class="section session-section" id="closure"><h2>3. Closure: do we stay inside?</h2><p>A chosen set is closed under an operation when every pair of inputs produces a result in that same set. This requirement is built into the notation S × S → S.</p><div class="table-scroll" tabindex="0" role="region" aria-label="Integer operation examples"><table><thead><tr><th scope="col">Operation on ℤ</th><th scope="col">Closed?</th><th scope="col">Why?</th></tr></thead><tbody><tr><td>Addition</td><td>Yes</td><td>The sum is an integer.</td></tr><tr><td>Subtraction</td><td>Yes</td><td>The difference is an integer.</td></tr><tr><td>Multiplication</td><td>Yes</td><td>The product is an integer.</td></tr><tr><td>Ordinary division</td><td>No</td><td>½ is outside ℤ; division by zero is undefined.</td></tr></tbody></table></div><p>The set matters. Subtraction stays inside ℤ, but it can leave the nonnegative integers: 2 − 5 = −3.</p></section>
<section class="section session-section" id="proof"><h2>4. Prove it for every pair</h2><p>Choose any even integers a = 2m and b = 2n, with m and n integers. Then:</p><p class="equation">a + b = 2m + 2n = 2(m + n)</p><p>Since m + n is an integer, the result is even. This proves closure under addition for every pair of even integers. A few examples alone would not prove this claim about an infinite set.</p></section>
<section class="section session-section" id="counterexample"><h2>5. One counterexample is enough</h2><p>Let S = {0, 1, 2}. Ordinary addition fails closure because 1 + 2 = 3, which lies outside S.</p><p>Now change the operation: add the inputs and take the remainder modulo 3.</p><p class="equation">1 ∗ 2 = 0 &nbsp;&nbsp; 2 ∗ 2 = 1</p><p>Every result belongs to S. We kept the same set but changed the operation. An algebraic structure describes both: (S, ∗).</p></section>
<section class="section session-section" id="practice"><h2>Your turn</h2><p>Let O = {2k + 1 | k ∈ ℤ}, the odd integers.</p><ol><li>Are they closed under addition?</li><li>Are they closed under multiplication?</li></ol><p>For each operation, give either a general argument or one counterexample.</p><details class="hint"><summary>A small hint</summary><p>Try a few examples first. For a proof, write the two inputs as 2m + 1 and 2n + 1, then simplify the result.</p></details><p class="lesson-status">Next lesson: associativity, identity, and inverses — planned, not drafted.</p></section><nav class="reader-nav" aria-label="Lesson navigation"><a href="#math/abstract-algebra">← Abstract Algebra</a><a href="#math">All Math ↗</a></nav></article>
</template>
