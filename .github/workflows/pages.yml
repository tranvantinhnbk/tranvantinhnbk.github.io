name: Build / manual deploy GitHub Pages

'on':
  push:
    branches: [main]
    paths:
      - 'github-blog/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'github-blog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-blog
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Angular 17's documented Node compatibility; upgrade Angular separately.
          node-version: '20'
          cache: npm
          cache-dependency-path: github-blog/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build static site
        run: npm run build -- --configuration production --base-href /
      - name: Prepare client-side route fallback
        run: |
          test -f dist/github-blog/index.html
          cp dist/github-blog/index.html dist/github-blog/404.html
          touch dist/github-blog/.nojekyll
      - name: Upload built site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-blog/dist/github-blog

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
