<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Engineering — Simple notebook draft</title>
<style>
:root{color-scheme:light;--paper:#faf8f2;--ink:#202d28;--quiet:#55645c;--line:#ccd5c9;--panel:#e9eee4;--accent:#375a37}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit;color:inherit}a,button,summary{touch-action:manipulation}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,pre:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:22px 30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.brand{font-weight:650}.brand small{font:11px/1.7 monospace;letter-spacing:1px}small{display:block;color:var(--quiet)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{padding:10px 12px;min-height:44px}.notice{padding:8px 30px;font:12px/1.6 monospace;border-bottom:1px solid var(--line);color:var(--quiet)}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr)}aside{padding:24px 18px;border-right:1px solid var(--line)}.sidebar-inner{position:sticky;top:18px;max-height:calc(100dvh - 36px);overflow:auto;padding:4px}aside h2{font:600 13px/1.7 system-ui;letter-spacing:1px;text-transform:uppercase}label{display:block;font-size:13px;margin-bottom:6px}input{width:100%;min-height:44px;padding:10px;background:transparent;border:1px solid #8a998c;border-radius:4px}.count{font-size:12px;color:var(--quiet)}summary{cursor:pointer;min-height:44px;padding:10px 0;font-size:13px;font-weight:600}.note-link,.portfolio-link{display:block;padding:10px;min-height:44px;font-size:13px;border-left:2px solid transparent;overflow-wrap:anywhere}.note-link:hover,[aria-current=page]{background:var(--panel);border-color:var(--accent)}.portfolio-links{border-top:1px solid var(--line);padding-top:18px;margin-top:24px}main{min-width:0;padding:38px clamp(20px,4vw,64px)}h1{font:500 clamp(36px,5vw,58px)/1.12 Georgia,serif;letter-spacing:-1.5px;overflow-wrap:anywhere;margin:18px 0 24px}h2{font:500 26px/1.3 Georgia,serif}h3{font:500 23px/1.3 Georgia,serif;margin:8px 0}p{max-width:650px;color:var(--quiet)}.eyebrow{font:12px/1.7 monospace;letter-spacing:1px;color:var(--accent);text-transform:uppercase}.intro{font-size:19px}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:32px;max-width:760px}.entry{display:block;padding:20px 0;border-bottom:1px solid var(--line)}article{max-width:720px;margin:auto}pre{overflow:auto;max-width:100%;background:var(--panel);padding:18px;border:1px solid var(--line);font:14px/1.7 monospace}button{min-height:44px;cursor:pointer;padding:10px 18px;border:1px solid var(--line);background:var(--panel)}.lazy-example{min-height:180px;padding:20px;margin:28px 0;background:var(--panel);border:1px solid var(--line)}canvas{display:block;width:100%;height:auto;margin-top:16px}.badge{display:inline-block;font:12px/1.6 monospace;background:var(--panel);padding:5px 10px}footer{font-size:12px;color:var(--quiet);margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}.notes-toggle{display:none}.skip{position:absolute;left:-10000px}.skip:focus{left:10px;top:10px;padding:12px;background:var(--paper);z-index:2}.subjects{display:flex;gap:8px;flex-wrap:wrap}.subjects span{font-size:13px;border:1px solid var(--line);padding:6px 10px}.route{font:13px monospace}
@media(max-width:900px){.workspace{grid-template-columns:225px minmax(0,1fr)}}
@media(max-width:620px){header{padding:18px;gap:14px}nav{width:100%;gap:0}nav a{padding:10px}.notice{padding:8px 18px}.workspace{display:block}.notes-toggle{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent}aside{display:none;border-right:0;border-bottom:1px solid var(--line)}.notes-open aside{display:block}.sidebar-inner{position:static;max-height:60dvh}main{padding:28px 18px}h1{font-size:38px}pre{font-size:13px}}
</style>
<a class="skip" href="#content">Skip to content</a>
<header><a class="brand" href="#home">General Engineering<small>TRAN VAN TINH / OPEN NOTEBOOK</small></a><nav aria-label="Main navigation"><a href="#home">Notebook</a><a href="#portfolio">About / CV</a><a href="#demo">Project demo</a></nav></header>
<div class="notice">UI DRAFT · EXAMPLE READER PROSE · NOTHING PUBLISHED</div>
<button class="notes-toggle" aria-controls="notes" aria-expanded="false">☰ All notes</button>
<div class="workspace"><aside id="notes" aria-label="All notes"><div class="sidebar-inner"><h2>All notes</h2><label for="search">Search notes</label><input id="search" type="search" placeholder="Title or subject…"><p class="count" role="status"></p><details open><summary>Computing</summary><div id="note-list"></div></details><p id="empty" hidden>No matching notes. Try another search.</p><div class="portfolio-links"><h2>Portfolio</h2><a class="portfolio-link" href="#portfolio">About / CV ↗</a><a class="portfolio-link" href="#demo">Digit recognition demo ↗</a><a class="portfolio-link" href="#certificates">Certificates ↗</a></div></div></aside><main id="content" tabindex="-1"></main></div>
<script>
(()=>{
const notes=[['two-sum','Two Sum'],['longest-substring-without-repeating-characters','Longest Substring Without Repeating Characters'],['longest-palindromic-substring','Longest Palindromic Substring'],['container-with-most-water','Container With Most Water']];
const main=document.getElementById('content');const input=document.getElementById('search');const workspace=document.querySelector('.workspace');const toggle=document.querySelector('.notes-toggle');
function index(){const query=input.value.trim().toLowerCase();const filtered=notes.filter(([,title])=>(title+' Computing Coding note').toLowerCase().includes(query));document.getElementById('note-list').innerHTML=filtered.map(([slug,title])=>`<a class="note-link" href="#note-${slug}" ${location.hash==='#note-'+slug?'aria-current="page"':''}>${title}<small>Coding note</small></a>`).join('');document.querySelector('.count').textContent=`${filtered.length} of ${notes.length} existing notes`;document.getElementById('empty').hidden=filtered.length>0;document.querySelector('aside details').hidden=!filtered.length;}
const footer='<footer>Independent thinking. Shared knowledge.</footer>';
function render(focus=false){const hash=location.hash;const note=notes.find(([slug])=>hash==='#note-'+slug);index();workspace.classList.remove('notes-open');toggle.setAttribute('aria-expanded','false');
if(note){main.innerHTML=`<article><a href="#home">← Notebook</a><p class="eyebrow">Computing / Coding note</p><h1>${note[1]}</h1><span class="badge">Illustrative prose for layout review</span><p>The title comes from the existing coding collection. The explanation below is example copy, awaiting content preparation and review.</p><div class="section"><h2>Start with a small example</h2><p>A short explanation introduces the problem, inputs, and assumptions before the code. Work through one concrete case so the reasoning is easy to follow.</p><pre tabindex="0" aria-label="Illustrative pseudocode"><code>read the input\ncheck the current state\nupdate the result</code></pre><h2>Reasoning and boundaries</h2><p>Explain why the approach works, then examine the edge cases and costs. Actual article content will need its own evidence and review.</p><div class="lazy-example"><h2>An interactive example</h2><p class="lazy-status" role="status">Optional illustration. Load it when you want to explore.</p><button data-load>Open interactive example</button><div class="lazy-output"></div></div><details><summary>Sources and limitations</summary><p>Layout sample only. No research results, source verification, or code correctness claims are made here.</p></details></div>${footer}</article>`;}
else if(['#portfolio','#demo','#certificates'].includes(hash)){const isDemo=hash==='#demo';const isCert=hash==='#certificates';main.innerHTML=`<article><a href="#home">← Notebook</a><p class="eyebrow">Earlier work / Preserved</p><h1>${isDemo?'Project demo.':isCert?'Certificates.':'About / CV.'}</h1><p>${isDemo?'The original handwritten digit recognition demo stays available as its own page. Its renderer and model load when that page is opened.':isCert?'The original certificate gallery remains available.':'The original profile, CV, and academic transcript remain available. This redesign does not change their content.'}</p><div class="section"><h2>Existing page</h2><p class="route">${isDemo?'/projects/mnist':isCert?'/certificate':'/about#CV'}</p><p>This preview shows the navigation handoff. The existing Angular page is preserved; it is not embedded or reimplemented here.</p>${!isDemo&&!isCert?'<p>The existing CV PDF is preserved in the application assets.</p>':''}</div>${footer}</article>`;}
else{main.innerHTML=`<p class="eyebrow">Across disciplines. Shared questions.</p><h1>Ideas worth<br>building on.</h1><p class="intro">A notebook of ideas, abstractions, and knowledge across science and engineering.</p><section class="section"><h2>From the notebook</h2><p>Four entries from the existing coding collection. Reader explanations in this preview are illustrative.</p>${notes.map(([slug,title])=>`<a class="entry" href="#note-${slug}"><small>Computing / Coding note</small><h3>${title} ↗</h3></a>`).join('')}</section><section class="section"><h2>Across science and engineering</h2><div class="subjects">${['Mathematics','Physics','Biology','Computing','Engineering','Intelligence'].map(s=>`<span>${s}</span>`).join('')}</div><p>Other subjects will grow as material is added. Contributing foundations toward SI and RSI is a long-term ambition.</p></section><section class="section"><h2>Earlier work</h2><p>Your original portfolio stays accessible alongside the notebook.</p><a href="#portfolio">About / CV ↗</a> · <a href="#demo">Digit recognition demo ↗</a> · <a href="#certificates">Certificates ↗</a></section>${footer}`;}
if(focus)main.focus();}
input.addEventListener('input',index);toggle.addEventListener('click',()=>{const open=workspace.classList.toggle('notes-open');toggle.setAttribute('aria-expanded',String(open));});window.addEventListener('hashchange',()=>render(true));
main.addEventListener('click',async event=>{const button=event.target.closest('[data-load]');if(!button)return;const block=button.closest('.lazy-example');button.disabled=true;block.setAttribute('aria-busy','true');block.querySelector('.lazy-status').textContent='Loading interactive example…';try{const {renderExample}=await import('./lazy-example.mjs');if(block.isConnected)renderExample(block);}catch{if(block.isConnected){button.disabled=false;button.textContent='Retry interactive example';block.querySelector('.lazy-status').textContent='Could not load. Serve this preview over local HTTP and try again.';}}finally{block.removeAttribute('aria-busy');}});render();
})();
</script>
</html>
