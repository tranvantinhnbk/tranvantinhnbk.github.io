<article class="math-reader"><p class="eyebrow">Mathematics / Abstract Algebra / Part 1</p><h1>Sets, operations,<br>and closure.</h1><span class="badge">Learning session · Draft for your review</span><p class="standfirst">Choose the objects. Define how to combine them. Then ask whether the result stays inside the same set.</p><div class="reading-goal"><strong>By the end</strong><p>You should be able to explain closure, prove a simple example, and disprove it with a counterexample.</p></div>
<section class="session-section" id="sets"><p class="section-number">01 / THE OBJECTS</p><h2>Which objects are we working with?</h2><p>A set specifies the objects under discussion. Our first example is the set of integers:</p><div class="equation-block" tabindex="0" role="region" aria-label="The set of integers"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">ℤ</mi><mo>=</mo><mo>{</mo><mo>…</mo><mo>,</mo><mo>−</mo><mn>2</mn><mo>,</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mo>…</mo><mo>}</mo></mrow><annotation encoding="application/x-tex">\mathbb{Z}=\{\ldots,-2,-1,0,1,2,\ldots\}</annotation></semantics></math><pre class="latex-source"><code>$$
\mathbb{Z}=\{\ldots,-2,-1,0,1,2,\ldots\}
$$</code></pre></div><p>We write <span class="inline-math"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3</mn><mo>∈</mo><mi mathvariant="normal">ℤ</mi></mrow><annotation encoding="application/x-tex">3\in\mathbb{Z}</annotation></semantics></math><code class="latex-source">$3\in\mathbb{Z}$</code></span> to say “3 belongs to the integers.” But <span class="inline-math"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>∉</mo><mi mathvariant="normal">ℤ</mi></mrow><annotation encoding="application/x-tex">\frac{1}{2}\notin\mathbb{Z}</annotation></semantics></math><code class="latex-source">$\frac{1}{2}\notin\mathbb{Z}$</code></span>: one half is not an integer.</p><p>Now restrict attention to the even integers:</p><div class="equation-block" tabindex="0" role="region" aria-label="The even integers"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>E</mi><mo>=</mo><mo>{</mo><mn>2</mn><mi>k</mi><mo>∣</mo><mi>k</mi><mo>∈</mo><mi mathvariant="normal">ℤ</mi><mo>}</mo></mrow><annotation encoding="application/x-tex">E=\{2k\mid k\in\mathbb{Z}\}</annotation></semantics></math><pre class="latex-source"><code>$$
E=\{2k\mid k\in\mathbb{Z}\}
$$</code></pre></div><div class="notation-note"><strong>Read it aloud</strong><p>“E is the set of numbers 2k, where k is an integer.” Choosing k = −1, 0, 1 gives −2, 0, 2.</p></div><p>Every element of E is an integer, so <span class="inline-math"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo>⊆</mo><mi mathvariant="normal">ℤ</mi></mrow><annotation encoding="application/x-tex">E\subseteq\mathbb{Z}</annotation></semantics></math><code class="latex-source">$E\subseteq\mathbb{Z}$</code></span>. The symbol ⊆ means “is a subset of.”</p></section>
<section class="session-section" id="operations"><p class="section-number">02 / THE RULE</p><h2>How do we combine two objects?</h2><div class="definition"><span class="block-label">Definition · Binary operation</span><p>A binary operation on a set S assigns every ordered pair of elements of S exactly one result in S.</p><div class="equation-block" tabindex="0" role="region" aria-label="A binary operation on S"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>∗</mo><mo>:</mo><mi>S</mi><mo>×</mo><mi>S</mi><mo>⟶</mo><mi>S</mi></mrow><annotation encoding="application/x-tex">\ast:S\times S\longrightarrow S</annotation></semantics></math><pre class="latex-source"><code>$$
\ast:S\times S\longrightarrow S
$$</code></pre></div></div><p>Read S × S as “all ordered pairs from S.” Addition, for example, takes the pair (3, 5) and returns 8.</p><p>The operation need not be arithmetic. Concatenation combines the strings “ab” and “cd” into “abcd”. The symbol ∗ names an operation; it does not necessarily mean multiplication.</p></section>
<section class="session-section" id="closure"><p class="section-number">03 / STAYING INSIDE</p><h2>Does the rule keep us inside the set?</h2><div class="definition"><span class="block-label">Definition · Closure</span><p>A chosen set is closed under an operation when combining any two of its elements produces another element of that set.</p><div class="equation-block" tabindex="0" role="region" aria-label="Closure for every pair of elements"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>∀</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo>∈</mo><mi>S</mi><mo>,</mo><mspace width="1em"/><mi>a</mi><mo>∗</mo><mi>b</mi><mo>∈</mo><mi>S</mi></mrow><annotation encoding="application/x-tex">\forall a,b\in S,\quad a\ast b\in S</annotation></semantics></math><pre class="latex-source"><code>$$
\forall a,b\in S,\quad a\ast b\in S
$$</code></pre></div></div><p>The symbol ∀ means “for every.” This is a claim about <em>every</em> pair of inputs, not just the examples we happen to try.</p><p>Closure is already required by the notation S × S → S. When testing an existing rule on a chosen set, we check whether it meets that requirement.</p><div class="table-scroll" tabindex="0" role="region" aria-label="Operations on the integers"><table><thead><tr><th scope="col">Operation on integers</th><th scope="col">Stays inside?</th><th scope="col">Reason</th></tr></thead><tbody><tr><td>Addition</td><td>Yes</td><td>The sum is an integer.</td></tr><tr><td>Subtraction</td><td>Yes</td><td>The difference is an integer.</td></tr><tr><td>Multiplication</td><td>Yes</td><td>The product is an integer.</td></tr><tr><td>Ordinary division</td><td>No</td><td>1 ÷ 2 is outside the integers; division by zero is undefined.</td></tr></tbody></table></div><p>The set matters as much as the operation. Subtraction stays inside the integers, but leaves the nonnegative integers when we compute 2 − 5 = −3.</p></section>
<section class="session-section" id="proof"><p class="section-number">04 / THE REASONING</p><h2>A proof for every pair of even integers</h2><div class="proposition"><span class="block-label">Proposition</span><p>The even integers are closed under addition.</p></div><div class="proof"><span class="block-label">Proof</span><p>Choose any two even integers. By the definition of evenness, write:</p><div class="equation-block" tabindex="0" role="region" aria-label="Represent any two even integers"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>a</mi><mo>=</mo><mn>2</mn><mi>m</mi><mo>,</mo><mspace width="1em"/><mi>b</mi><mo>=</mo><mn>2</mn><mi>n</mi><mo>,</mo><mspace width="1.5em"/><mi>m</mi><mo>,</mo><mi>n</mi><mo>∈</mo><mi mathvariant="normal">ℤ</mi></mrow><annotation encoding="application/x-tex">a=2m,\quad b=2n,\qquad m,n\in\mathbb{Z}</annotation></semantics></math><pre class="latex-source"><code>$$
a=2m,\quad b=2n,\qquad m,n\in\mathbb{Z}
$$</code></pre></div><p>Add them, then factor out 2:</p><div class="equation-block" tabindex="0" role="region" aria-label="Aligned proof that the sum of two even integers is even"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtable columnalign="right left" columnspacing="0.4em" rowspacing="0.6em"><mtr><mtd><mi>a</mi><mo>+</mo><mi>b</mi></mtd><mtd><mo>=</mo><mn>2</mn><mi>m</mi><mo>+</mo><mn>2</mn><mi>n</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo><mn>2</mn><mo>(</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo>)</mo></mtd></mtr></mtable></mrow><annotation encoding="application/x-tex">\begin{aligned}a+b&amp;=2m+2n\\&amp;=2(m+n)\end{aligned}</annotation></semantics></math><pre class="latex-source"><code>$$
\begin{aligned}a+b&amp;=2m+2n\\&amp;=2(m+n)\end{aligned}
$$</code></pre></div><p>Because m + n is an integer, 2(m + n) is even. The result belongs to E, as required.</p><p class="proof-end" aria-label="End of proof">□</p></div><div class="notation-note"><strong>Why this proves the claim</strong><p>We did not choose special values for m and n. The same reasoning applies to every pair of even integers.</p></div></section>
<section class="session-section" id="counterexample"><p class="section-number">05 / WHEN THE RULE FAILS</p><h2>One counterexample is enough</h2><p>Take <span class="inline-math"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>=</mo><mo>{</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>}</mo></mrow><annotation encoding="application/x-tex">S=\{0,1,2\}</annotation></semantics></math><code class="latex-source">$S=\{0,1,2\}$</code></span>. Ordinary addition fails closure because 1 + 2 = 3, and 3 is outside S.</p><p>Now keep S but change the operation:</p><div class="equation-block" tabindex="0" role="region" aria-label="Addition followed by the remainder modulo three"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>)</mo><mspace width="0.5em"/><mo>mod</mo><mspace width="0.4em"/><mn>3</mn></mrow><annotation encoding="application/x-tex">a\ast b=(a+b)\bmod 3</annotation></semantics></math><pre class="latex-source"><code>$$
a\ast b=(a+b)\bmod 3
$$</code></pre></div><p>This means: add the inputs, then take the remainder on division by 3. For example, 1 ∗ 2 = 0 and 2 ∗ 2 = 1. Every remainder is 0, 1, or 2, so this operation stays inside S.</p><p>An algebraic structure records the set and its operation together: <span class="inline-math"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>(</mo><mi>S</mi><mo>,</mo><mo>∗</mo><mo>)</mo></mrow><annotation encoding="application/x-tex">(S,\ast)</annotation></semantics></math><code class="latex-source">$(S,\ast)$</code></span>.</p></section>
<section class="session-section exercise" id="practice"><p class="section-number">06 / YOUR TURN</p><h2>Try the odd integers</h2><div class="equation-block" tabindex="0" role="region" aria-label="The set of odd integers"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>O</mi><mo>=</mo><mo>{</mo><mn>2</mn><mi>k</mi><mo>+</mo><mn>1</mn><mo>∣</mo><mi>k</mi><mo>∈</mo><mi mathvariant="normal">ℤ</mi><mo>}</mo></mrow><annotation encoding="application/x-tex">O=\{2k+1\mid k\in\mathbb{Z}\}</annotation></semantics></math><pre class="latex-source"><code>$$
O=\{2k+1\mid k\in\mathbb{Z}\}
$$</code></pre></div><ol><li>Are they closed under addition?</li><li>Are they closed under multiplication?</li></ol><p>For each operation, give either a general argument or one counterexample.</p><details class="hint"><summary>A small hint</summary><p>Write the two inputs as 2m + 1 and 2n + 1. Simplify their sum and product. Does the result have the required form?</p></details></section><p class="lesson-status">Next: associativity, identity, and inverses — planned, not drafted.</p><nav class="reader-nav" aria-label="Lesson navigation"><a href="#math/abstract-algebra">← Abstract Algebra</a><a href="#math">All Math ↗</a></nav></article>

else{main.innerHTML=`<p class="eyebrow">Across disciplines. Shared questions.</p><h1>Ideas worth<br>building on.</h1><p class="intro">A notebook across science and engineering.</p><section class="section"><h2>Subjects</h2><a class="entry" href="#math"><h3>Math ↗</h3><p>Abstract Algebra — learning session drafts.</p></a></section><section class="section"><h2>From our learning session</h2><a class="entry" href="#${lesson}"><small>MATHEMATICS / ABSTRACT ALGEBRA / DRAFT</small><h3>Part 1: Sets, operations, and closure ↗</h3></a></section><section class="section"><h2>Across disciplines</h2><p>Physics · Biology · Computing · Engineering · Intelligence</p></section>`+footer;}
