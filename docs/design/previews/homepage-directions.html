<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>General Engineering — UI directions</title>
<style>
html{color-scheme:light dark}body{margin:0} .preview-controls{padding:12px 20px;background:light-dark(#faf8f2,#151a18);color:light-dark(#202d28,#e9ede7);font:14px system-ui;border-bottom:1px solid #788578}.preview-controls select{font:inherit;min-height:44px;margin-left:10px}

#ge-directions{--paper:light-dark(#faf8f2,#151a18);--ink:light-dark(#202d28,#e9ede7);--quiet:light-dark(#55645c,#afbbb2);--line:light-dark(#ccd5c9,#3d4a41);--panel:light-dark(#e9eee4,#253027);--accent:light-dark(#375a37,#badc9e);color:var(--ink);font:15px/1.6 system-ui,sans-serif}
#ge-directions *{box-sizing:border-box}#ge-directions [hidden]{display:none!important}#ge-directions .stage{min-height:900px;background:var(--paper)}#ge-directions header{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}#ge-directions .brand{font-weight:650;letter-spacing:-.5px}#ge-directions .byline{display:block;font:11px/1.6 monospace;letter-spacing:1px;color:var(--quiet)}#ge-directions nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;padding-right:70px}#ge-directions button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;padding:8px 12px}#ge-directions button:hover{background:var(--panel)}#ge-directions button:focus-visible,#ge-directions select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#ge-directions .brand-button{padding:0;text-align:left}#ge-directions main{padding:36px 32px}#ge-directions h1{font:500 clamp(36px,6vw,64px)/1.06 Georgia,serif;letter-spacing:-2px;margin:15px 0 22px;max-width:680px;overflow-wrap:break-word}#ge-directions h2{font:500 26px/1.25 Georgia,serif;margin:0 0 14px}#ge-directions h3{font:500 22px/1.25 Georgia,serif;margin:8px 0}#ge-directions p{color:var(--quiet);margin:0 0 16px;max-width:580px}#ge-directions .eyebrow{font:11px/1.6 monospace;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent)}#ge-directions .notice{padding:8px 30px;font:11px/1.5 monospace;color:var(--quiet);border-bottom:1px solid var(--line)}#ge-directions .hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;padding:14px 0 38px}#ge-directions .primary{background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:3px}#ge-directions .primary:hover{background:var(--accent);color:var(--paper)}#ge-directions .orbit-art{min-height:260px;display:grid;place-items:center;background:var(--panel);border-radius:48% 48% 2px 2px;position:relative;overflow:hidden}#ge-directions .orbit{height:180px;width:180px;border:1px solid var(--accent);border-radius:50%;transform:rotate(-25deg)}#ge-directions .orbit:before,#ge-directions .orbit:after{content:'';position:absolute;inset:25px -20px;border:1px solid var(--accent);border-radius:50%;transform:rotate(55deg)}#ge-directions .orbit:after{inset:-15px 55px;transform:rotate(-15deg)}#ge-directions .section{padding-top:26px;border-top:1px solid var(--line);margin-top:22px}#ge-directions .subjects{display:flex;gap:6px 12px;flex-wrap:wrap;margin:18px 0 25px}#ge-directions .subjects button{border-bottom:1px solid var(--line);padding-left:0}#ge-directions .stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}#ge-directions .story{text-align:left;display:block;padding:18px 0;border-top:1px solid var(--line);width:100%}#ge-directions .story p{font-size:13px;margin:0}#ge-directions footer{padding:18px 30px;border-top:1px solid var(--line);color:var(--quiet);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#ge-directions .atlas .hero{grid-template-columns:1fr;padding-bottom:22px}#ge-directions .atlas h1{font-family:system-ui,sans-serif;font-weight:550;max-width:600px;font-size:clamp(34px,5vw,54px)}#ge-directions .atlas .atlas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:34px}#ge-directions .atlas .discipline{background:var(--panel);border:1px solid var(--line);padding:22px;text-align:left;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}#ge-directions .atlas .discipline:hover{border-color:var(--accent)}#ge-directions .discipline strong{font-size:19px;font-weight:500}#ge-directions .discipline span{font:11px monospace;color:var(--quiet)}#ge-directions .atlas h2,#ge-directions .atlas h3{font-family:system-ui,sans-serif}
#ge-directions .field .body-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:35px}#ge-directions .field aside{border-right:1px solid var(--line);padding-right:18px}#ge-directions .field aside button{display:block;text-align:left;padding-left:0;width:100%;font-size:13px}#ge-directions .field .hero{display:block;padding:0 0 22px}#ge-directions .field h1{font-size:clamp(36px,5vw,51px)}#ge-directions .field .entry{display:grid;grid-template-columns:85px minmax(0,1fr);gap:18px;padding:22px 0;border-top:1px solid var(--line);width:100%;text-align:left}#ge-directions .field .entry h3{margin-top:0}#ge-directions .entry .index{font:11px/1.8 monospace;color:var(--quiet)}#ge-directions .field .principle{margin-top:28px;padding:20px;background:var(--panel);border-left:2px solid var(--accent)}#ge-directions .reader{max-width:640px;margin:0 auto}#ge-directions .reader p{font-size:17px;line-height:1.8}#ge-directions .reader details{margin-top:24px}#ge-directions .reader summary{cursor:pointer;min-height:44px}#ge-directions .library select{font:inherit;max-width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:10px;margin:12px 0 25px}#ge-directions .empty{padding:30px 0}#ge-directions .menu{display:none}
@media(max-width:620px){#ge-directions .stage{min-height:1380px}#ge-directions header{padding:18px;gap:12px}#ge-directions nav{margin:0;padding:0;gap:0;width:100%}#ge-directions nav[hidden]{display:none}#ge-directions .menu{display:block;margin-left:auto}#ge-directions main{padding:24px 18px}#ge-directions .hero{grid-template-columns:1fr;gap:20px}#ge-directions .orbit-art{min-height:150px;border-radius:3px}#ge-directions .orbit{height:100px;width:100px}#ge-directions .orbit:after{inset:-10px 28px}#ge-directions .stories{grid-template-columns:1fr;gap:0}#ge-directions .atlas .atlas-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#ge-directions .atlas .discipline{padding:14px;min-height:120px}#ge-directions .discipline strong{font-size:16px;overflow-wrap:anywhere}#ge-directions .field .body-grid{grid-template-columns:1fr;gap:20px}#ge-directions .field aside{border-right:0;border-bottom:1px solid var(--line);padding:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 10px}#ge-directions .field aside .eyebrow{width:100%}#ge-directions .field aside button{width:auto}#ge-directions .field .entry{grid-template-columns:1fr;gap:6px}#ge-directions .entry .index br{display:none}#ge-directions h1{letter-spacing:-1.2px}#ge-directions .notice{padding:8px 18px}#ge-directions footer{padding:18px}}

#ge-directions .workspace{display:grid;grid-template-columns:260px minmax(0,1fr)}
#ge-directions .workspace main{min-width:0}
#ge-directions .notes-sidebar{border-right:1px solid var(--line);padding:24px 18px;background:var(--paper);min-width:0}
#ge-directions .notes-sidebar .sidebar-inner{position:sticky;top:18px;max-height:calc(100dvh - 36px);overflow:auto;padding:4px}
#ge-directions .notes-sidebar label{display:block;font-size:13px;margin:12px 0 6px}
#ge-directions input[type=search]{width:100%;min-height:44px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px;color:var(--ink);font:inherit}
#ge-directions input:focus-visible,#ge-directions a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#ge-directions .note-group{margin-top:18px}#ge-directions .note-group summary{cursor:pointer;min-height:44px;display:list-item;font-size:13px;font-weight:600;padding:10px 0}
#ge-directions .note-link{display:block;min-height:44px;padding:10px;text-decoration:none;color:var(--ink);font-size:13px;border-left:2px solid transparent;overflow-wrap:anywhere}
#ge-directions .note-link:hover,#ge-directions .note-link[aria-current=page]{background:var(--panel);border-color:var(--accent)}
#ge-directions .note-link small{display:block;color:var(--quiet);font:11px/1.5 monospace}
#ge-directions .notes-toggle{display:none}#ge-directions .note-count{font-size:12px;color:var(--quiet);margin:10px 0}
#ge-directions .lazy-example{border:1px solid var(--line);background:var(--panel);padding:20px;margin:28px 0;min-height:180px}
#ge-directions .lazy-example canvas{display:block;width:100%;height:auto;margin-top:16px}#ge-directions .skip{position:absolute;left:-10000px}#ge-directions .skip:focus{left:12px;top:12px;background:var(--paper);color:var(--ink);padding:12px;z-index:3}
@media(min-width:621px) and (max-width:1050px){#ge-directions .workspace{grid-template-columns:225px minmax(0,1fr)}#ge-directions .hero{grid-template-columns:1fr}#ge-directions .stories{grid-template-columns:1fr}#ge-directions .atlas .atlas-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#ge-directions .field .body-grid{display:block}}
@media(max-width:620px){#ge-directions .workspace{display:block}#ge-directions .notes-toggle{display:block;width:100%;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line)}#ge-directions .notes-sidebar{display:none;border-right:0;border-bottom:1px solid var(--line)}#ge-directions .workspace.notes-open .notes-sidebar{display:block}#ge-directions .notes-sidebar .sidebar-inner{position:static;max-height:60dvh}#ge-directions .notes-sidebar .note-link{width:100%;padding:10px}#ge-directions .notes-sidebar .eyebrow{display:block}}
</style>
<div class="preview-controls"><label>Homepage direction <select id="direction"><option value="editorial">Editorial notebook</option><option value="atlas">Knowledge atlas</option><option value="field">Field notes</option></select></label></div>
<div id="ge-directions" class="viz-carousel" aria-label="General Engineering homepage directions">
<section data-variant="Editorial notebook" aria-label="Editorial notebook homepage"><div class="stage editorial" data-style="editorial"></div></section>
<section data-variant="Knowledge atlas" aria-label="Knowledge atlas homepage" hidden><div class="stage atlas" data-style="atlas"></div></section>
<section data-variant="Field notes" aria-label="Field notes homepage" hidden><div class="stage field" data-style="field"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('ge-directions');
const subjects=['Mathematics','Physics','Biology','Computing','Engineering','Intelligence'];
const entries=[{subject:'Mathematics',kind:'Essay',title:'What survives when a system changes?',text:'Invariants as a language for understanding change.'},{subject:'Biology',kind:'Connection',title:'From living cells to feedback loops',text:'One question, viewed through organisms and engineered systems.'},{subject:'Computing',kind:'Source study',title:'Where integer boundaries break assumptions',text:'A proposed exploration of representation, parsing, and edge cases.'},{subject:'Physics',kind:'Reading note',title:'Energy and the cost of computation',text:'Questions at the boundary of physics and information.'},{subject:'Engineering',kind:'Essay',title:'Learning from failure',text:'Observability, useful constraints, and adaptation.'},{subject:'Intelligence',kind:'Open question',title:'What would count as recursive improvement?',text:'Turning a long-term ambition into questions we can test.'}];
function noteIndex(stage,query=''){
const list=stage.querySelector('.note-list');const selected=stage.dataset.article;
const matches=entries.filter(e=>(e.title+' '+e.subject+' '+e.kind).toLowerCase().includes(query.toLowerCase()));
list.innerHTML=subjects.map(subject=>{const group=matches.filter(e=>e.subject===subject);return group.length?`<details class="note-group" open><summary>${subject} · ${group.length}</summary>${group.map(e=>{const i=entries.indexOf(e);return `<a class="note-link" href="#${stage.dataset.style}-note-${i}" data-article="${i}" ${selected===String(i)?'aria-current="page"':''}>${e.title}<small>${e.kind} · Sample</small></a>`}).join('')}</details>`:''}).join('')||'<p role="status">No matching notes. Try another title or subject.</p>';
stage.querySelector('.note-count').textContent=`${matches.length} of ${entries.length} sample notes`;
}
function syncIndex(stage){if(stage.dataset.page!=='article')delete stage.dataset.article;noteIndex(stage,stage.querySelector('input[type=search]').value);}
function closeNotes(stage){stage.querySelector('.workspace').classList.remove('notes-open');stage.querySelector('.notes-toggle').setAttribute('aria-expanded','false');}
async function drawExample(block){const button=block.querySelector('[data-load]');button.disabled=true;block.setAttribute('aria-busy','true');block.querySelector('.lazy-status').textContent='Loading interactive example…';try{const {renderExample}=await import('./lazy-example.mjs');if(block.isConnected)renderExample(block);}catch(error){if(block.isConnected){button.disabled=false;button.textContent='Retry interactive example';block.querySelector('.lazy-status').textContent='Could not load the example. Use the local HTTP preview and try again.';}}finally{block.removeAttribute('aria-busy');}}

function story(e){const i=entries.indexOf(e);return `<button class="story" data-article="${i}"><span class="eyebrow">${e.subject} / ${e.kind}</span><h3>${e.title}</h3><p>${e.text}</p></button>`;}
function subjectsRow(){return `<div class="subjects">${subjects.map(s=>`<button data-subject="${s}">${s} ↗</button>`).join('')}</div>`;}
function home(stage){const style=stage.dataset.style;const main=stage.querySelector('main');
if(style==='editorial')main.innerHTML=`<section class="hero"><div><span class="eyebrow">Across disciplines. Shared questions.</span><h1>Ideas worth<br>building on.</h1><p>A notebook of principles, abstractions, and connections across science and engineering.</p><button class="primary" data-page="library">Explore the notebook ↗</button></div><div class="orbit-art" aria-label="Abstract overlapping orbits"><div class="orbit" aria-hidden="true"></div></div></section><section class="section"><h2>Follow your curiosity</h2>${subjectsRow()}</section><section class="section"><h2>From the notebook</h2><div class="stories">${entries.slice(0,3).map(story).join('')}</div></section>`;
if(style==='atlas')main.innerHTML=`<section class="hero"><span class="eyebrow">The knowledge atlas</span><h1>Different fields.<br>Connected ideas.</h1><p>Choose a subject. Follow a question. Discover where the boundaries meet.</p></section><div class="atlas-grid">${subjects.map((s,i)=>`<button class="discipline" data-subject="${s}"><span>FIELD 0${i+1} ↗</span><strong>${s}</strong></button>`).join('')}</div><section class="section"><h2>Connections worth exploring</h2><div class="stories">${[entries[1],entries[3],entries[5]].map(story).join('')}</div></section>`;
if(style==='field')main.innerHTML=`<div class="body-grid"><div><section class="hero"><span class="eyebrow">Notes by Tran Van Tinh</span><h1>Think deeply.<br>Leave useful traces.</h1><p>Questions, source investigations, and working ideas. Open for others to test and build on.</p></section>${entries.slice(0,3).map((e,i)=>`<button class="entry" data-article="${i}"><span class="index">NOTE 0${i+1}<br> ${e.kind}</span><div><span class="eyebrow">${e.subject}</span><h3>${e.title}</h3><p>${e.text}</p></div></button>`).join('')}<div class="principle"><span class="eyebrow">Working principle</span><p>State the question. Show the reasoning. Make room for correction.</p></div></div></div>`;
stage.dataset.page='home';syncIndex(stage);}
function library(stage,subject='All subjects'){const main=stage.querySelector('main');main.innerHTML=`<div class="library"><button data-page="home">← Home</button><h1>The notebook.</h1><p>Sample entries across science and engineering.</p><label>Browse subject<br><select aria-label="Browse subject">${['All subjects',...subjects].map(s=>`<option ${s===subject?'selected':''}>${s}</option>`).join('')}</select></label><div class="results"></div></div>`;filter(stage,subject);stage.dataset.page='library';syncIndex(stage);}
function filter(stage,subject){stage.querySelector('.results').innerHTML=entries.filter(e=>subject==='All subjects'||e.subject===subject).map(story).join('');}
function article(stage,index){const e=entries[index];stage.querySelector('main').innerHTML=`<article class="reader"><button data-subject="${e.subject}">← ${e.subject}</button><p class="eyebrow">${e.subject} / ${e.kind} / Sample article</p><h1>${e.title}</h1><p>${e.text}</p><p class="byline">Tran Van Tinh · Illustrative reader layout</p><section class="section"><h2>Start with a concrete question</h2><p>Which relationships remain useful when the context changes? Begin with a small example, make its assumptions explicit, and examine what survives.</p><h2>Follow the connection</h2><p>A shared pattern can suggest a new investigation. Similar descriptions still need evidence before we treat them as the same mechanism.</p><div class="lazy-example"><h2>Explore a signal</h2><p class="lazy-status" role="status">Illustrative interactive example. Open it when you want to explore.</p><button class="primary" data-load>Open interactive example</button><div class="lazy-output"></div></div><details><summary>Sources and limitations</summary><p>This is sample prose for reviewing the reading experience. A published article would include primary sources, a precise model, and its limitations.</p></details></section><button data-page="library">Explore more notes ↗</button></article>`;stage.dataset.page='article';stage.dataset.article=String(index);syncIndex(stage);}
root.querySelectorAll('.stage').forEach(stage=>{stage.innerHTML=`<a class="skip" href="#main-${stage.dataset.style}">Skip to content</a><header><button class="brand-button" data-page="home"><span class="brand">General Engineering</span><span class="byline">TRAN VAN TINH / OPEN KNOWLEDGE</span></button><nav aria-label="Main navigation"><button data-page="home">Home</button><button data-page="library">Library</button><button data-page="about">About</button></nav></header><div class="notice">DESIGN EXPLORATION · ALL ARTICLES ARE SAMPLES</div><button class="notes-toggle" aria-expanded="false" aria-controls="notes-${stage.dataset.style}">☰ All notes</button><div class="workspace"><aside class="notes-sidebar" id="notes-${stage.dataset.style}" aria-label="All notes"><div class="sidebar-inner"><span class="eyebrow">All notes</span><label for="search-${stage.dataset.style}">Search titles, subjects, types</label><input id="search-${stage.dataset.style}" type="search" placeholder="Find a note…"><p class="note-count" role="status"></p><div class="note-list"></div></div></aside><main id="main-${stage.dataset.style}" tabindex="-1" aria-live="polite"></main></div><footer><span>Independent thinking. Shared knowledge.</span><span>Across science & engineering</span></footer>`;home(stage);
stage.addEventListener('click',ev=>{const b=ev.target.closest('button,a[data-article]');if(!b)return;if(b.matches('a[data-article]')&&(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey))return;if(b.matches('a[data-article]'))ev.preventDefault();if(b.classList.contains('notes-toggle')){const open=stage.querySelector('.workspace').classList.toggle('notes-open');b.setAttribute('aria-expanded',String(open));return;}if(b.hasAttribute('data-load')){drawExample(b.closest('.lazy-example'));return;}if(b.classList.contains('menu')){const nav=stage.querySelector('nav');const expanded=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!expanded));nav.hidden=expanded;return;}if(b.dataset.article!==undefined)article(stage,Number(b.dataset.article));else if(b.dataset.subject)library(stage,b.dataset.subject);else if(b.dataset.page==='home')home(stage);else if(b.dataset.page==='library')library(stage);else if(b.dataset.page==='about'){stage.querySelector('main').innerHTML=`<article class="reader"><span class="eyebrow">About</span><h1>Knowledge others can build on.</h1><p>I'm Tran Van Tinh. General Engineering brings together ideas and abstractions across mathematics, physics, biology, computing, and engineering.</p><h2>Ambition, with evidence</h2><p>The long-term ambition is to contribute useful foundations toward superintelligence and recursive self-improvement. Trust comes from clear reasoning, evidence, and correction.</p><button data-page="home">← Back home</button></article>`;stage.dataset.page='about';syncIndex(stage);}
closeNotes(stage);stage.querySelector('main').focus();if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{direction:stage.parentElement.dataset.variant,page:stage.dataset.page},privateContent:null}).catch(()=>{});});
stage.addEventListener('input',ev=>{if(ev.target.matches('input[type=search]'))noteIndex(stage,ev.target.value);});
stage.addEventListener('change',ev=>{if(ev.target.matches('select'))filter(stage,ev.target.value);});
if(globalThis.Tweak){const state={serif:stage.dataset.style!=='atlas'};const tweak=new Tweak({container:stage,onChange:()=>{stage.style.setProperty('--heading-font',state.serif?'Georgia, serif':'system-ui, sans-serif');stage.querySelectorAll('h1,h2,h3').forEach(h=>h.style.fontFamily=state.serif?'Georgia, serif':'system-ui, sans-serif');}});tweak.addToggle(state,'serif',{label:'Serif headings'});}
});
function selectDirection(style){root.querySelectorAll('[data-variant]').forEach(section=>section.hidden=section.querySelector('.stage').dataset.style!==style);}
document.getElementById('direction').addEventListener('change',ev=>selectDirection(ev.target.value));
function openHash(){const match=location.hash.match(/^#(editorial|atlas|field)-note-(\d+)$/);if(!match||!entries[Number(match[2])])return;document.getElementById('direction').value=match[1];selectDirection(match[1]);article(root.querySelector(`[data-style="${match[1]}"]`),Number(match[2]));}
window.addEventListener('hashchange',openHash);openHash();
})();
</script>

</html>
